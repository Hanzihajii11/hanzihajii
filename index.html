<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hanzi Web - Minecraft Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Lexend:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff8c00; 
            --bg: #0d0d0d; --text: #ffffff; --card: #1a1a1a; --header: #000000;
        }

        body.light-mode {
            --bg: #ffffff; --text: #1a1a1a; --card: #f2f2f2; --header: #eeeeee;
        }

        body { margin: 0; font-family: 'Lexend', sans-serif; background: var(--bg); color: var(--text); transition: 0.3s; }

        /* LOGO HANZI WEB - CHỮ VIẾT TAY */
        header { 
            padding: 40px 5%; 
            background: var(--header); 
            text-align: center; 
            border-bottom: 4px solid var(--primary); 
        }
        .logo-text {
            font-family: 'Dancing Script', cursive;
            font-size: 65px;
            color: var(--primary);
            margin: 0;
            cursor: pointer;
            text-shadow: 2px 2px 10px rgba(255, 140, 0, 0.3);
        }

        /* THANH TÌM KIẾM */
        .search-container { padding: 20px 5%; background: var(--header); text-align: center; }
        .search-bar {
            width: 100%; max-width: 500px; padding: 12px 25px; border-radius: 30px; 
            border: 2px solid var(--primary); background: var(--card); color: var(--text); outline: none;
            font-size: 16px;
        }

        /* MENU PHÂN LOẠI BO GÓC CHUẨN */
        nav { background: var(--header); display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; padding: 15px 5%; border-bottom: 1px solid #333; }
        nav button {
            cursor: pointer; color: var(--text); font-size: 12px; font-weight: 700; padding: 12px 24px;
            border: 3px solid #000; border-radius: 15px; background: var(--card); transition: 0.2s; text-transform: uppercase;
        }
        nav button.active, nav button:hover { background: var(--primary); color: white; transform: translateY(-3px); }

        /* DANH SÁCH BÀI VIẾT (GRID) */
        .container { padding: 30px 5%; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
        .card { background: var(--card); border-radius: 15px; overflow: hidden; border: 2px solid #333; transition: 0.3s; }
        .card.hidden { display: none; }
        .card img { width: 100%; height: 180px; object-fit: cover; }
        .card-body { padding: 15px; }
        .btn-dl { display: block; width: 100%; padding: 12px 0; background: var(--primary); color: white; text-align: center; text-decoration: none; font-weight: bold; border-radius: 10px; }

        /* NÚT ĐỔI MÀU NỀN */
        .theme-switch { position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; background: var(--primary); border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 26px; z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    </style>
</head>
<body id="mainBody">

    <header>
        <div class="logo-text" onclick="location.reload()">Hanzi Web</div>
    </header>

    <div class="search-container">
        <input type="text" id="searchInp" class="search-bar" placeholder="Tìm kiếm Map, Addon, Shader..." onkeyup="search()">
    </div>

    <nav id="filterMenu">
        <button class="active" onclick="filter('all', this)">TRANG CHỦ</button>
        <button onclick="filter('map', this)">MAP</button>
        <button onclick="filter('addon', this)">ADDON</button>
        <button onclick="filter('shader', this)">SHADER</button>
        <button onclick="filter('resource', this)">RESOURCE PACK</button>
        <button onclick="filter('version', this)">PHIÊN BẢN</button>
    </nav>

    <div class="container" id="grid">
        </div>

    <div class="theme-switch" onclick="toggleTheme()" id="tBtn">🌙</div>
    
    <div style="position:fixed; bottom:10px; left:10px; font-size:10px; cursor:pointer; color:#555;" onclick="adminIn()">ADMIN PANEL</div>

    <script>
        function toggleTheme() {
            const b = document.getElementById('mainBody');
            b.classList.toggle('light-mode');
            document.getElementById('tBtn').innerHTML = b.classList.contains('light-mode') ? '☀️' : '🌙';
        }

        function load() {
            const data = JSON.parse(localStorage.getItem('hanzi_data')) || [];
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            data.forEach(p => {
                grid.innerHTML += `
                    <div class="card" data-cat="${p.cat}" data-title="${p.title.toLowerCase()}">
                        <img src="${p.img}" onerror="this.src='https://via.placeholder.com/300x180?text=Hanzi+Web'">
                        <div class="card-body">
                            <div style="font-size:10px; color:var(--primary); font-weight:bold;">${p.cat.toUpperCase()}</div>
                            <div style="font-weight:bold; margin:10px 0; height:40px; overflow:hidden;">${p.title}</div>
                            <a href="${p.link}" target="_blank" class="btn-dl">TẢI XUỐNG</a>
                        </div>
                    </div>
                `;
            });
        }

        function filter(cat, btn) {
            document.querySelectorAll('#filterMenu button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('.card').forEach(c => {
                c.classList.toggle('hidden', cat !== 'all' && c.getAttribute('data-cat') !== cat);
            });
        }

        function search() {
            const s = document.getElementById('searchInp').value.toLowerCase();
            document.querySelectorAll('.card').forEach(c => {
                c.classList.toggle('hidden', !c.getAttribute('data-title').includes(s));
            });
        }

        // Đăng bài nhanh (Chỉ dành cho AD)
    <script>
        // MẬT KHẨU CỦA BẠN (Bạn có thể đổi chữ 'hanzi123' thành gì tùy thích)
        const ADMIN_PASSWORD = "hanzi123"; 

        function adminIn() {
            const pass = prompt("XÁC MINH DANH TÍNH ADMIN:");
            if (pass === ADMIN_PASSWORD) {
                const t = prompt("Tên bài viết:");
                const c = prompt("Loại (map/addon/shader/resource/version):");
                const i = prompt("Link ảnh minh họa:");
                const l = prompt("Link tải rút gọn:");
                
                if(t && l) {
                    const data = JSON.parse(localStorage.getItem('hanzi_data')) || [];
                    data.unshift({title:t, cat:c, img:i, link:l});
                    localStorage.setItem('hanzi_data', JSON.stringify(data));
                    load();
                    alert("ĐÃ ĐĂNG BÀI THÀNH CÔNG! ✅");
                }
            } else if (pass !== null) {
                alert("SAI MẬT KHẨU! BẠN KHÔNG CÓ QUYỀN TRUY CẬP. ❌");
            }
        }

        function toggleTheme() {
            const b = document.getElementById('mainBody');
            b.classList.toggle('light-mode');
            document.getElementById('tBtn').innerHTML = b.classList.contains('light-mode') ? '☀️' : '🌙';
        }

        function load() {
            const data = JSON.parse(localStorage.getItem('hanzi_data')) || [];
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            data.forEach(p => {
                grid.innerHTML += `
                    <div class="card" data-cat="${p.cat}" data-title="${p.title.toLowerCase()}">
                        <img src="${p.img}" onerror="this.src='https://via.placeholder.com/300x180?text=Hanzi+Web'">
                        <div class="card-body">
                            <div style="font-size:10px; color:var(--primary); font-weight:bold;">${p.cat.toUpperCase()}</div>
                            <div style="font-weight:bold; margin:10px 0; height:40px; overflow:hidden;">${p.title}</div>
                            <a href="${p.link}" target="_blank" class="btn-dl">TẢI XUỐNG</a>
                        </div>
                    </div>
                `;
            });
        }

        function filter(cat, btn) {
            document.querySelectorAll('#filterMenu button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('.card').forEach(c => {
                c.classList.toggle('hidden', cat !== 'all' && c.getAttribute('data-cat') !== cat);
            });
        }

        function search() {
            const s = document.getElementById('searchInp').value.toLowerCase();
            document.querySelectorAll('.card').forEach(c => {
                c.classList.toggle('hidden', !c.getAttribute('data-title').includes(s));
            });
        }

        window.onload = load;
    </script>

        window.onload = load;
    </script>
</body>

</html>
